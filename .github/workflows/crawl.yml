name: Weekly Crawl

on:
  workflow_dispatch:
    inputs:
      confirm_live_crawl:
        description: 'Run a real database-writing crawl with possible model API charges'
        required: true
        type: boolean
        default: false
permissions:
  contents: read

jobs:
  crawl:
    if: ${{ inputs.confirm_live_crawl == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run crawler
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_EMBEDDING_MODEL: text-embedding-v3
          QWEN_CHAT_MODEL: qwen-plus
        run: npx tsx scripts/crawl.ts --vectorize

      - name: Summary
        if: always()
        run: echo "Crawl job completed at $(date)"
